[project]
name = "aquawatch"
version = "0.2.0"
description = "AquaWatch Jamaica: zone-level leak/anomaly alerts for investigation (research prototype, synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (the plain-pip install path).
dependencies = [
    "pandas>=2.0,<4",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "skops>=0.10,<1",
    "pandera>=0.24,<1",
    "streamlit>=1.28,<2",
    "plotly>=5.18,<8",
]

[dependency-groups]
dev = [
    "pytest>=7.0,<10",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pre-commit>=3.5",
]

[tool.uv]
# This is an app, not a library to publish: install dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["research_notes", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests add the project root to sys.path before importing.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
