[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aquawatch"
version = "0.2.0"
description = "AquaWatch Jamaica: zone-level leak/anomaly alerts for investigation (research prototype, synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (the plain-pip install path).
dependencies = [
    "pandas>=2.0,<4",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "skops>=0.10,<1",
    "pandera>=0.24,<1",
    "streamlit>=1.50,<2",
    "plotly>=5.18,<8",
]

[project.scripts]
aquawatch = "aquawatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aquawatch"]

[dependency-groups]
dev = [
    "pytest>=7.0,<10",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pre-commit>=3.5",
]
# Only needed to regenerate data/simulated/ (scripts/simulate_network.py).
# WNTR 1.5 has no Python 3.14 build yet, hence the marker.
simulate = [
    "wntr>=1.5,<2; python_version < '3.14'",
    "six>=1.16; python_version < '3.14'",
]

[tool.uv]
# Install the aquawatch package itself (editable), so imports and the
# `aquawatch` command work the same in tests, scripts, the app and CI.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["research_notes", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
